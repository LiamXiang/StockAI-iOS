name: iOS Build (KMP)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ios-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build iOS Simulator Framework (KMP)
        run: ./gradlew :shared:linkDebugFrameworkIosSimulatorArm64 --no-daemon

      - name: Build iOS App (Simulator, no signing)
        run: |
          xcodebuild \
            -project iosApp/StockAI.xcodeproj \
            -target iosApp \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
          echo "=== Ad-hoc 签名（模拟器运行必需）==="
          codesign --force --sign - --timestamp=none iosApp/build/Debug-iphonesimulator/StockAI.app
          codesign -dv iosApp/build/Debug-iphonesimulator/StockAI.app 2>&1 | head -3

      - name: Package App
        run: |
          cd iosApp/build/Debug-iphonesimulator
          zip -r StockAI-ios-simulator.zip StockAI.app
          cp StockAI-ios-simulator.zip ../../../StockAI-ios-simulator.zip
          ls -la ../../../StockAI-ios-simulator.zip

      - name: Smoke test on iOS Simulator
        continue-on-error: true
        run: |
          set +e
          echo "=== 可用模拟器 ==="
          xcrun simctl list devices available | grep -E "iPhone" | head -8
          DEVICE_ID=$(xcrun simctl list devices available | grep -E "iPhone" | grep -oE "\([0-9A-F-]{36}\)" | head -1 | tr -d '()')
          if [ -z "$DEVICE_ID" ]; then echo "NO_SIMULATOR"; exit 0; fi
          echo "DEVICE_ID=$DEVICE_ID"
          xcrun simctl boot "$DEVICE_ID" 2>/dev/null || true
          xcrun simctl bootstatus "$DEVICE_ID" -b 2>&1 | tail -2
          # 干净安装：先卸载旧版，清空上次数据
          xcrun simctl uninstall booted com.dsa.stockai 2>/dev/null || true
          xcrun simctl install booted iosApp/build/Debug-iphonesimulator/StockAI.app && echo "INSTALL_OK"
          echo "=== 启动 App（无 console，模拟器冷启动较慢）==="
          xcrun simctl launch booted com.dsa.stockai && echo "LAUNCH_RETURNED"
          sleep 30
          echo "=== 进程存活检查 ==="
          xcrun simctl spawn booted launchctl list | grep -i stockai && echo "APP_ALIVE" || echo "APP_CRASHED_OR_NOT_RUNNING"
          echo "=== 崩溃写盘文件 ==="
          DATA_DIR=$(xcrun simctl get_app_container booted com.dsa.stockai data 2>/dev/null)
          echo "DATA_DIR=$DATA_DIR"
          if [ -n "$DATA_DIR" ] && [ -f "$DATA_DIR/Documents/stockai_crash.log" ]; then
            echo "CRASH_LOG_FOUND"; cat "$DATA_DIR/Documents/stockai_crash.log"
            cp "$DATA_DIR/Documents/stockai_crash.log" StockAI-crash.log
          else
            echo "NO_CRASH_LOG_FILE"
          fi
          echo "=== CrashReporter 目录 ==="
          ls -lt ~/Library/Logs/CrashReporter/ 2>/dev/null | grep -i stockai | head -3
          echo "=== StockAI 相关日志 ==="
          xcrun simctl spawn booted log show --last 3m --predicate 'processImagePath CONTAINS "StockAI" OR eventMessage CONTAINS "StockAI-Crash" OR eventMessage CONTAINS "StockAI-InitError" OR eventMessage CONTAINS "StockAI-MARK"' --style compact 2>/dev/null | tail -120 || true
          echo "=== Crash 事件日志 ==="
          xcrun simctl spawn booted log show --last 3m --predicate 'eventMessage CONTAINS "com.dsa.stockai" AND (eventType == error OR eventMessage CONTAINS "SIGABRT" OR eventMessage CONTAINS "SIGSEGV" OR eventMessage CONTAINS "EXC_BAD" OR eventMessage CONTAINS "crash")' --style compact 2>/dev/null | tail -40 || true
          echo "=== Crash Reports (.ips) ==="
          ls -lt ~/Library/Logs/DiagnosticReports/ 2>/dev/null | grep -i stockai | head -3
          CRASH=$(ls -t ~/Library/Logs/DiagnosticReports/StockAI*.ips 2>/dev/null | head -1)
          if [ -z "$CRASH" ]; then echo "NO_CRASH_REPORT_FOUND"; else echo "CRASH_FILE=$CRASH"; cp "$CRASH" StockAI-crash.ips; fi

      - name: Upload Crash Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: StockAI-CrashReport
          path: |
            StockAI-crash.ips
            StockAI-crash.log
          if-no-files-found: ignore

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StockAI-iOS-Simulator
          path: StockAI-ios-simulator.zip
          if-no-files-found: error

  build-device:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build iOS Device Framework (KMP, arm64)
        run: ./gradlew :shared:linkDebugFrameworkIosArm64 --no-daemon

      - name: Build iOS App (Device, unsigned ipa)
        run: |
          xcodebuild \
            -project iosApp/StockAI.xcodeproj \
            -target iosApp \
            -configuration Debug \
            -sdk iphoneos \
            FRAMEWORK_SEARCH_PATHS='$(SRCROOT)/../shared/build/bin/iosArm64/debugFramework' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package unsigned ipa
        run: |
          mkdir -p Payload
          cp -r iosApp/build/Debug-iphoneos/StockAI.app Payload/
          zip -r StockAI-unsigned.ipa Payload
          rm -rf Payload
          ls -la StockAI-unsigned.ipa

      - name: Upload Artifact (unsigned ipa)
        uses: actions/upload-artifact@v4
        with:
          name: StockAI-Untagged-IPA
          path: StockAI-unsigned.ipa
          if-no-files-found: error
